services:
  worker:
    build:
      context: .
      dockerfile: workers/cells/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "6379"
      EVENT_ID: "${EVENT_ID:-1}"
      WORKER_BATCH_SIZE: "${WORKER_BATCH_SIZE:-100}"
      WORKER_INTERVAL_SECONDS: "${WORKER_INTERVAL_SECONDS:-1.0}"
      WORKER_SYNTHETIC_DUMMY_MODE: "${WORKER_SYNTHETIC_DUMMY_MODE:-0}"
