services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"

  worker:
    build:
      context: .
      dockerfile: workers/cells/Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EVENT_ID: "${EVENT_ID:-1}"
      WORKER_BATCH_SIZE: "${WORKER_BATCH_SIZE:-100}"
      WORKER_INTERVAL_SECONDS: "${WORKER_INTERVAL_SECONDS:-1.0}"
      WORKER_SYNTHETIC_DUMMY_MODE: "${WORKER_SYNTHETIC_DUMMY_MODE:-0}"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
