version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      RATE_LIMIT_CAPACITY: "5"
      RATE_LIMIT_REFILL_RATE: "1"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
