apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
data:
  book-event.js: |
    import http from 'k6/http';

    export const options = {
      vus: 100,
      duration: '1m',
    };

    export default function () {
      http.post('https://api.your-domain.com/events/1/book', JSON.stringify({
        user_id: __VU
      }), {
        headers: { 'Content-Type': 'application/json' }
      });
    }

# Change address to running external IP